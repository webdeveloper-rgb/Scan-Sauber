name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install

      - name: Añadir plataforma Android (Capacitor)
        run: npx cap add android

      - name: Asegurar permiso de cámara y dependencia de ML Kit en el manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "--- Manifest antes de parchear ---"
          cat "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' "$MANIFEST" || \
            sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>\n</application>#' "$MANIFEST"
          echo "--- Manifest después de parchear ---"
          cat "$MANIFEST"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de depuración (instalable directamente, sin firma de Play Store)
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-stock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
